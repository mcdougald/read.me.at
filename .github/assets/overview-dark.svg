<text x="256" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="256" dy="0">Tables of contents,</tspan><tspan x="256" dy="21">multi-part series,</tspan><tspan x="256" dy="21">related posts and a</tspan><tspan x="256" dy="21">distraction-free</tspan><tspan x="256" dy="21">reader mode.</tspan></text>
