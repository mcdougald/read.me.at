<text x="468" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="468" dy="0">Full-text search</tspan><tspan x="468" dy="21">across every article</tspan><tspan x="468" dy="21">body, with scored</tspan><tspan x="468" dy="21">results, snippets and</tspan><tspan x="468" dy="21">highlighting.</tspan></text>
