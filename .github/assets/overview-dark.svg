<text x="44" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a3a3a3"><tspan x="44" dy="0">Posts, notes,</tspan><tspan x="44" dy="21">projects and life</tspan><tspan x="44" dy="21">updates, each with</tspan><tspan x="44" dy="21">its own index and one</tspan><tspan x="44" dy="21">shared front page.</tspan></text>
